<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMTFFL XVI — Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0d0f12;
    --surface: #141720;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #7fffb2;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --blue: #60a5fa;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    background: rgba(13,15,18,0.97);
    flex-shrink: 0;
  }
  .header-title { font-family: var(--font-head); font-weight: 700; font-size: 15px; }
  .header-title span { color: var(--accent); }
  #status-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border2); color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  #status-pill.ready { border-color: var(--accent); color: var(--accent); }
  #status-pill.loading { border-color: var(--accent3); color: var(--accent3); }
  #status-pill.error { border-color: var(--accent2); color: var(--accent2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* CHAT AREA */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 820px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    line-height: 1.6;
    max-width: 680px;
  }
  .msg.user .bubble {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
  }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .msg-label {
    font-size: 10px; color: var(--muted); letter-spacing: 0.05em;
    font-family: var(--font-head); font-weight: 600; text-transform: uppercase;
    padding: 0 4px;
  }

  /* answer formatting */
  .bubble p { margin-bottom: 0.5rem; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: var(--accent); font-weight: 600; }
  .bubble em { color: var(--accent3); font-style: normal; }
  .bubble ul, .bubble ol { padding-left: 1.25rem; margin-bottom: 0.5rem; }
  .bubble li { margin-bottom: 0.2rem; }
  .bubble table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 12px; }
  .bubble th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border2); padding: 4px 8px; }
  .bubble td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .bubble tr:last-child td { border-bottom: none; }

  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    width: 100%;
    max-width: 680px;
  }
  .chart-wrap canvas { max-height: 300px; }

  .thinking {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12px; padding: 0.5rem 0;
  }
  .thinking-dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }

  /* INPUT */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem;
    background: var(--bg);
    flex-shrink: 0;
  }
  #input-wrap {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 8px 8px 14px;
    transition: border-color 0.15s;
  }
  #input-wrap:focus-within { border-color: var(--accent); }
  #question {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
    resize: none; line-height: 1.5; max-height: 120px; min-height: 20px;
  }
  #question::placeholder { color: var(--muted); }
  #send-btn {
    background: var(--accent); color: #0d0f12;
    border: none; border-radius: 6px; padding: 6px 14px;
    font-family: var(--font-head); font-weight: 700; font-size: 12px;
    cursor: pointer; flex-shrink: 0; transition: opacity 0.15s;
  }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.75rem;
  }
  .suggestion {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border2); color: var(--muted);
    cursor: pointer; font-family: var(--font-mono);
    transition: border-color 0.15s, color 0.15s;
    background: transparent;
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); }

  /* welcome */
  .welcome {
    align-self: center; text-align: center;
    padding: 3rem 1rem; max-width: 500px;
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
  }
  .welcome h2 { font-family: var(--font-head); font-size: 22px; font-weight: 700; }
  .welcome h2 span { color: var(--accent); }
  .welcome p { color: var(--muted); line-height: 1.7; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="header-title">OMTFFL XVI <span>/ Analyst</span></div>
  <div id="status-pill" class="loading"><div class="dot"></div><span id="status-text">Loading data...</span></div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>Ask anything about <span>OMTFFL XVI</span></h2>
    <p>Match results, standings, form, margins, luck — anything. Some questions needing player-level data will take a few extra seconds to fetch.</p>
  </div>
</div>

<div id="input-area">
  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="ask(this.textContent)">Has a single player ever won a H2H match on their own?</button>
    <button class="suggestion" onclick="ask(this.textContent)">Who has the best record in GWs 20 onwards?</button>
    <button class="suggestion" onclick="ask(this.textContent)">Which team scores most consistently?</button>
    <button class="suggestion" onclick="ask(this.textContent)">Who has been unluckiest this season?</button>
    <button class="suggestion" onclick="ask(this.textContent)">What's the highest score in any single GW?</button>
  </div>
  <div id="input-wrap">
    <textarea id="question" placeholder="Ask a question about the league..." rows="1"></textarea>
    <button id="send-btn" onclick="sendQuestion()" disabled>Ask</button>
  </div>
</div>

<script>
const PROXY = 'https://omtffl-proxy.vercel.app/api/league';
const ENTRY_ID = 196569; // Rael's entry

let leagueData = null;
let chartCount = 0;
let conversationHistory = [];

// ── DATA LOADING ──────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const [leagueRes, bootRes] = await Promise.all([
      fetch(`${PROXY}?id=39004`),
      fetch(`${PROXY}?endpoint=bootstrap`)
    ]);
    if (!leagueRes.ok) throw new Error(`HTTP ${leagueRes.status}`);
    leagueData = await leagueRes.json();

    // Build player name map {elementId: {name, team, position}}
    if (bootRes.ok) {
      const boot = await bootRes.json();
      const posLabels = {1:'GK',2:'DEF',3:'MID',4:'FWD'};
      leagueData.playerMap = Object.fromEntries(
        (boot.elements || []).map(e => [e.id, {
          name: `${e.first_name} ${e.second_name}`,
          webName: e.web_name,
          pos: posLabels[e.element_type] || '?'
        }])
      );
    } else {
      leagueData.playerMap = {};
    }

    setStatus('ready', `GW${getMaxGW()} loaded`);
    document.getElementById('send-btn').disabled = false;
    document.getElementById('question').disabled = false;
  } catch(e) {
    setStatus('error', 'Failed to load');
    console.error(e);
  }
}

function getMaxGW() {
  const finished = leagueData.matches.filter(m => m.finished);
  return finished.length ? Math.max(...finished.map(m => m.event)) : 0;
}

function setStatus(cls, text) {
  const pill = document.getElementById('status-pill');
  pill.className = `${cls}`;
  document.getElementById('status-text').textContent = text;
  // re-add dot
  if (!pill.querySelector('.dot')) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    pill.prepend(dot);
  }
}

// ── CHAT UI ───────────────────────────────────────────────────────────────────
function addMessage(role, content, isHtml = false) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Analyst';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (isHtml) bubble.innerHTML = content;
  else bubble.textContent = content;

  msg.appendChild(label);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addThinking() {
  const chat = document.getElementById('chat');
  const el = document.createElement('div');
  el.className = 'thinking';
  el.id = 'thinking';
  el.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div><span>Thinking...</span>`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function removeThinking() {
  document.getElementById('thinking')?.remove();
}

function updateThinking(text) {
  const el = document.getElementById('thinking');
  if (el) el.querySelector('span:last-child').textContent = text;
}

function addChart(config) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg assistant';

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = 'Analyst';

  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  const canvas = document.createElement('canvas');
  const id = `chart-${++chartCount}`;
  canvas.id = id;
  wrap.appendChild(canvas);
  msg.appendChild(label);
  msg.appendChild(wrap);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;

  try {
    new Chart(canvas, config);
  } catch(e) {
    wrap.innerHTML = `<span style="color:var(--muted);font-size:12px">Chart error: ${e.message}</span>`;
  }
}

// ── QUESTION HANDLING ─────────────────────────────────────────────────────────
function ask(text) {
  document.getElementById('question').value = text;
  sendQuestion();
}

async function sendQuestion() {
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question || !leagueData) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('suggestions').style.display = 'none';

  addMessage('user', question);
  addThinking();

  try {
    const answer = await runAnalysis(question);
    removeThinking();

    if (answer.chart) {
      if (answer.text) addMessage('assistant', answer.text, true);
      addChart(answer.chart);
    } else {
      addMessage('assistant', answer.text, true);
    }

    conversationHistory.push({ role: 'user', content: question });
    conversationHistory.push({ role: 'assistant', content: answer.raw || answer.text });

  } catch(e) {
    removeThinking();
    addMessage('assistant', `Sorry, something went wrong: ${e.message}`, false);
  }

  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── ANALYSIS ENGINE ───────────────────────────────────────────────────────────
async function runAnalysis(question) {
  // Build the data context
  const { league_entries, matches, standings } = leagueData;
  const entryMap = Object.fromEntries(league_entries.map(e => [e.id, { name: e.entry_name, player: `${e.player_first_name} ${e.player_last_name}`, entryId: e.entry_id }]));
  const finished = matches.filter(m => m.finished);
  const maxGW = finished.length ? Math.max(...finished.map(m => m.event)) : 0;

  // Compact data summary for Claude
  const dataContext = {
    league_entries: league_entries.map(e => ({
      id: e.id,
      entry_id: e.entry_id,
      name: e.entry_name,
      player: `${e.player_first_name} ${e.player_last_name}`
    })),
    standings: standings.map(s => ({
      league_entry: s.league_entry,
      rank: s.rank,
      total: s.total,
      matches_won: s.matches_won,
      matches_drawn: s.matches_drawn,
      matches_lost: s.matches_lost,
      points_for: s.points_for
    })),
    matches: finished.map(m => ({
      gw: m.event,
      e1: m.league_entry_1, e1_pts: m.league_entry_1_points,
      e2: m.league_entry_2, e2_pts: m.league_entry_2_points
    })),
    playerMap: leagueData.playerMap || {},
    maxGW,
    proxyUrl: PROXY
  };

  // Keep history short
  const historySnippet = conversationHistory.length > 0
    ? `\nPrevious Q&A:\n${conversationHistory.slice(-2).map(m => `${m.role}: ${m.content.slice(0,200)}`).join('\n')}`
    : '';

  // Single lightweight call to decide if player data is needed
  updateThinking('Thinking...');

  const needsRes = await fetch('https://omtffl-proxy.vercel.app/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 120,
      system: 'Respond ONLY with JSON (no markdown): {"needsPlayerData":false,"gwsNeeded":[]}. needsPlayerData=true only if the question needs individual player scores or picks. gwsNeeded should list the GW numbers as integers needed (all finished GWs if season-wide).',
      messages: [{ role: 'user', content: `GWs 1-${dataContext.maxGW} finished.${historySnippet}\n${historySnippet ? historySnippet + '\n' : ''}Question: ${question}` }]
    })
  });

  if (!needsRes.ok) throw new Error(`API error ${needsRes.status}`);
  const needsData = await needsRes.json();
  let needsCheck = { needsPlayerData: false, gwsNeeded: [] };
  try { needsCheck = JSON.parse(needsData.content[0].text.replace(/```json|```/g, '').trim()); }
  catch(e) { /* default: no player data */ }

  // Fetch player data if needed
  let playerDataByGW = {};
  let picksDataByGW = {};

  if (needsCheck.needsPlayerData && needsCheck.gwsNeeded?.length) {
    const gwList = needsCheck.gwsNeeded.map(Number).filter(n => n >= 1 && n <= dataContext.maxGW);
    updateThinking(`Fetching data for GWs ${gwList.join(', ')}...`);

    await Promise.all(gwList.map(async gw => {
      const liveRes = await fetch(`${PROXY}?endpoint=live&id=${gw}`);
      if (liveRes.ok) playerDataByGW[gw] = await liveRes.json();
    }));

    updateThinking('Fetching picks...');
    await Promise.all(gwList.map(async gw => {
      picksDataByGW[gw] = {};
      await Promise.all(league_entries.map(async e => {
        const r = await fetch(`${PROXY}?endpoint=picks&id=${e.entry_id}&gw=${gw}`);
        if (r.ok) picksDataByGW[gw][e.id] = await r.json();
      }));
    }));
  }

  // Step 2: slim down player data before sending to reduce payload size
  const slimPlayerData = {};
  Object.entries(playerDataByGW).forEach(([gw, gwData]) => {
    slimPlayerData[gw] = { elements: {} };
    Object.entries(gwData.elements || {}).forEach(([id, el]) => {
      const s = el.stats || {};
      slimPlayerData[gw].elements[id] = { stats: {
        total_points: s.total_points || 0,
        minutes: s.minutes || 0,
        goals_scored: s.goals_scored || 0,
        assists: s.assists || 0,
        clean_sheets: s.clean_sheets || 0,
        bonus: s.bonus || 0
      }};
    });
  });

  // Step 3: full analysis call — send all relevant data and get code + answer
  updateThinking('Analysing...');

  // Build team/manager context dynamically from loaded data
  const teamContext = league_entries.map(e => {
    const s = leagueData.standings.find(s => s.league_entry === e.id);
    return `- "${e.entry_name}" (manager: ${e.player_first_name} ${e.player_last_name}, leagueEntryId: ${e.id}, rank: ${s?.rank ?? '?'}, W${s?.matches_won ?? 0}/D${s?.matches_drawn ?? 0}/L${s?.matches_lost ?? 0})`;
  }).join('\n');

  const codeSystemPrompt = `You are a data analyst for OMTFFL XVI, a 16-team FPL Draft H2H fantasy football league. Season is 2024/25.
Scoring: Win = 3pts, Draw = 1pt, Loss = 0pts. Each GW one team plays one other.
The user asking questions is Rael Miller, manager of "Wait UnTel Tomorrow" (leagueEntryId: ${league_entries.find(e => e.entry_id === 196569)?.id ?? 'unknown'}).

Teams in the league:
${teamContext}

When the user says "I" or "my team", they mean Wait UnTel Tomorrow / Rael Miller.
When they say "last week" or "last GW", they mean GW${maxGW}.
Interpret natural language flexibly — "best manager", "luckiest team", "who's been on form" etc should all map to appropriate computations.
A "good" weekly score is 60+, "bad" is under 40. A close game is within 3pts. A blowout is 20+ pts.

You must respond with ONLY a JSON object (no markdown, no backticks, no extra text):
{"code": "javascript that sets a variable called result", "wantsChart": false}

Variables available in the executed code:
- matches: [{gw, e1, e1_pts, e2, e2_pts}]
- standings: [{league_entry, rank, total, matches_won, matches_drawn, matches_lost, points_for}]
- league_entries: [{id, entry_id, name, player}]
- entryMap: {leagueEntryId: {name, player, entryId}}
- playerMap: {elementId: {name, webName, pos}} — ALWAYS use playerMap[id]?.webName for player names, never show raw IDs
- playerDataByGW: {gw: {elements: {elementId: {stats: {total_points, minutes, goals_scored, assists, clean_sheets, bonus}}}}}
- picksDataByGW: {gw: {leagueEntryId: {picks: [{element, position, multiplier}]}}}
- getBestXI(picks, gwElements, posMap): helper that applies FPL auto-sub rules to a picks array and returns the best valid XI score for that GW. picks = array of {element, position}, gwElements = playerDataByGW[gw].elements, posMap = object mapping elementId to position (1=GK,2=DEF,3=MID,4=FWD) built from playerMap as: const posMap = Object.fromEntries(Object.entries(playerMap).map(([id,p]) => [id, {GK:1,DEF:2,MID:3,FWD:4}[p.pos]||3]))

For hypothetical "what if I kept my GW1 squad" questions:
1. Get the target team's GW1 picks from picksDataByGW[1][leagueEntryId]
2. For each GW, call getBestXI(gw1picks, playerDataByGW[gw].elements, posMap) to get the frozen squad's best valid score
3. Compare to actual scores from matches data

Rules for the code:
- result must be a clean human-readable string, never raw JSON or object dumps
- Always use entryMap[id]?.name for team names, playerMap[id]?.webName for player names
- Always use * for multiplication (never omit the operator)
- For charts: wantsChart:true, result = {text: "summary sentence", chartConfig: {...Chart.js 4 config}}
- Chart theme: colors #7fffb2/#ff6b6b/#ffd166, grid rgba(255,255,255,0.07), ticks #6b7280, legend #e8eaf0
- If the question can't be answered with available data, set result to a helpful explanation of why`;

  // Only send small static data to Claude — never the player/picks data (too large)
  // Claude writes JS code that runs in the browser where the data is already available
  const analysisPayload = JSON.stringify({
    model: 'claude-sonnet-4-6',
    max_tokens: 4000,
    system: codeSystemPrompt,
    messages: [{
      role: 'user',
      content: `Static data: ${JSON.stringify({
        matches: dataContext.matches,
        standings: dataContext.standings,
        league_entries: dataContext.league_entries
      })}
playerMap sample (first 5): ${JSON.stringify(Object.fromEntries(Object.entries(dataContext.playerMap).slice(0,5)))}
playerDataByGW keys available: ${JSON.stringify(Object.keys(slimPlayerData).map(Number))}
picksDataByGW keys available: ${JSON.stringify(Object.keys(picksDataByGW).map(Number))}
${historySnippet}
Question: ${question}`
    }]
  });
  console.log('Analysis payload:', analysisPayload.length, 'bytes');
  const analysisRes = await fetch('https://omtffl-proxy.vercel.app/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: analysisPayload
  });

  if (!analysisRes.ok) throw new Error(`API error ${analysisRes.status}`);
  const analysisData = await analysisRes.json();
  const analysisRaw = analysisData.content[0].text.replace(/```json|```javascript|```js|```/g, '').replace(/^\s*`+|`+\s*$/g, '').trim();

  let analysis;
  try {
    analysis = JSON.parse(analysisRaw);
  } catch(e) {
    // JSON.parse failed — likely because code contains unescaped newlines
    // Try to extract the code block manually
    const codeMatch = analysisRaw.match(/"code"\s*:\s*"([\s\S]*?)(?:"\s*,\s*"wantsChart"|"\s*\})/);
    const chartMatch = analysisRaw.match(/"wantsChart"\s*:\s*(true|false)/);
    if (codeMatch) {
      const rawCode = codeMatch[1]
        .replace(/\\n/g, '\n')
        .replace(/\\"/g, '"')
        .replace(/\\t/g, '\t');
      analysis = { code: rawCode, wantsChart: chartMatch?.[1] === 'true' };
    } else if (/result\s*=/.test(analysisRaw)) {
      // Raw JS leaked out without JSON wrapper — use it directly
      analysis = { code: analysisRaw, wantsChart: false };
    } else {
      return { text: formatText(analysisData.content[0].text), raw: analysisData.content[0].text };
    }
  }

  updateThinking('Computing...');

  // Helper: given a squad (picks array) + player points for a GW + posMap, return best valid XI score
  // This implements FPL auto-sub rules: GK for GK, formation constraints, only sub in players who played
  const getBestXI = (picks, gwElements, posMap) => {
    const getPos = id => posMap[id] || 3;
    const didPlay = id => (gwElements[String(id)]?.stats?.minutes || 0) > 0;
    const getPts = id => gwElements[String(id)]?.stats?.total_points || 0;
    const isValid = squad => {
      const c = {1:0,2:0,3:0,4:0};
      squad.forEach(p => { c[p.pos] = (c[p.pos]||0)+1; });
      return c[1]>=1 && c[2]>=3 && c[3]>=2 && c[4]>=1 && squad.length===11;
    };
    const starters = picks.filter(p => p.position<=11).map(p => ({...p, pos: getPos(p.element)}));
    const bench = picks.filter(p => p.position>11).sort((a,b) => a.position-b.position).map(p => ({...p, pos: getPos(p.element), used: false}));
    // GK sub
    const gkI = starters.findIndex(p => p.pos===1);
    const gkB = bench.findIndex(p => p.pos===1);
    if (gkI>=0 && gkB>=0 && !didPlay(starters[gkI].element) && didPlay(bench[gkB].element)) {
      starters[gkI] = {...bench[gkB], pos:1}; bench[gkB].used = true;
    }
    // Outfield subs
    for (const sub of bench) {
      if (sub.used || sub.pos===1 || !didPlay(sub.element)) continue;
      for (let i=0; i<starters.length; i++) {
        if (starters[i].pos===1 || didPlay(starters[i].element)) continue;
        const test = starters.map((s,j) => j===i ? {...sub} : s);
        if (isValid(test)) { starters[i] = {...sub}; sub.used=true; break; }
      }
    }
    return starters.reduce((sum, p) => sum + getPts(p.element), 0);
  };

  try {
    const fn = new Function('matches', 'standings', 'league_entries', 'entryMap', 'playerMap', 'playerDataByGW', 'picksDataByGW', 'getBestXI',
      `${analysis.code}; return result;`
    );
    const result = fn(
      dataContext.matches, dataContext.standings, dataContext.league_entries,
      entryMap, dataContext.playerMap, slimPlayerData, picksDataByGW, getBestXI
    );

    if (result && typeof result === 'object' && result.chartConfig) {
      return { text: result.text ? formatText(result.text) : null, chart: result.chartConfig, raw: result.text };
    } else {
      return { text: formatText(String(result)), raw: String(result) };
    }
  } catch(e) {
    // Code execution failed — ask Claude to answer directly from the data
    updateThinking('Retrying...');
    const fallbackRes = await fetch('https://omtffl-proxy.vercel.app/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: `Answer this question in plain English using the data provided. Question: ${question}\n\nData: ${JSON.stringify({matches: dataContext.matches, standings: dataContext.standings, league_entries: dataContext.league_entries})}${historySnippet}` }]
      })
    });
    const fallbackData = await fallbackRes.json();
    return { text: formatText(fallbackData.content[0].text), raw: fallbackData.content[0].text };
  }
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>').replace(/$/, '</p>');
}

// ── INPUT AUTO-RESIZE ─────────────────────────────────────────────────────────
const textarea = document.getElementById('question');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
});
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});
textarea.disabled = true;

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
</script>
